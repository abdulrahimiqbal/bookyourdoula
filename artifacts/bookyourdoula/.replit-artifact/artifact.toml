kind = "web"
previewPath = "/"
title = "BookYourDoula"
version = "1.0.0"
id = "artifacts/bookyourdoula"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21551

[services.development]
run = "pnpm --filter @workspace/bookyourdoula run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bookyourdoula", "run", "build" ]
publicDir = "artifacts/bookyourdoula/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21551"
BASE_PATH = "/"
